services:
  postgres:
    image: postgres:16-alpine
    container_name: aurora-retail-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aurora_retail
      POSTGRES_USER: aurora_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in your environment or .env}
    ports:
      - "5432:5432"
    volumes:
      - aurora_pgdata:/var/lib/postgresql/data
      - ./schema_postgres.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora_user -d aurora_retail"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aurora_pgdata:
